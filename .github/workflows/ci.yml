name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # Pinned to immutable SHAs, same as refresh-institutions.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate license file
        run: npm run set-license

      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck specs
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Build
        run: npm run build

      - name: Unit tests
        run: node scripts/run-tests.mjs --timeout=600
