<div class="chat-scrim fixed inset-0 z-[55] bg-scrim backdrop-blur-md md:hidden"
     [class.chat-scrim--exit]="chatStore.isClosing()"
     aria-hidden="true" (click)="closePanel()"></div>

<section
  id="rumi-chat-panel"
  role="dialog"
  [attr.aria-modal]="isMobileViewport() ? 'true' : 'false'"
  aria-labelledby="rumi-chat-title"
  aria-describedby="rumi-chat-subtitle"
  tabindex="-1"
  class="chat-panel fixed inset-x-0 bottom-0 z-[60] flex h-[85dvh] max-h-[100dvh] flex-col overflow-hidden rounded-t-3xl border border-hairline bg-surface text-brand-deep dark:text-brand-light shadow-card md:right-6 md:inset-x-auto md:bottom-24 md:h-[600px] md:max-h-[calc(100dvh-9rem)] md:w-[380px] md:rounded-3xl md:bg-glass md:backdrop-blur-xl"
  [class.chat-panel--lifted]="liftedForPlayer()"
  [class.bottom-40]="liftedForPlayer()"
  [class.chat-panel--exit]="chatStore.isClosing()"
  [class.chat-panel--minimized]="chatStore.isMinimized()">
  <div class="mx-auto mt-3 h-1 w-12 rounded-full bg-brand/30 md:hidden" aria-hidden="true"></div>

  <header class="flex h-16 min-h-16 items-center gap-3 border-b border-hairline px-4">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center overflow-hidden rounded-full bg-gradient-to-br from-brand-dark to-brand-deep text-on-brand" aria-hidden="true">
      <img src="assets/logos/rumi_logo.svg" alt="" class="h-7 w-7 object-contain">
    </div>
    <div class="min-w-0 flex-1">
      <h2 id="rumi-chat-title" class="text-lg font-bold leading-tight">Rumi AI</h2>
      <p id="rumi-chat-subtitle" class="text-xs text-brand-dark dark:text-brand-light">Your smart AI companion</p>
    </div>
    <button
      type="button"
      class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-brand-deep dark:text-brand-light hover:bg-brand/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2"
      aria-label="Minimize Rumi AI chat"
      (click)="minimizePanel()">
      <svg [lucideIcon]="'minus'" [size]="18" aria-hidden="true"></svg>
    </button>
    <button
      type="button"
      class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-brand-deep dark:text-brand-light hover:bg-brand/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2"
      aria-label="Close Rumi AI chat"
      (click)="closePanel()">
      <svg [lucideIcon]="'x'" [size]="18" aria-hidden="true"></svg>
    </button>
  </header>

  @if (!chatStore.isMinimized()) {
    <div class="flex min-h-0 flex-1 flex-col overflow-hidden text-base">
      <app-chat-message-list></app-chat-message-list>
      @if (!hasUserMessages()) {
        <div class="shrink-0 px-4 pb-3">
          <app-chat-suggestions></app-chat-suggestions>
        </div>
      }
    </div>

    <footer class="shrink-0 border-t border-hairline p-3">
      <app-chat-composer></app-chat-composer>
    </footer>
  }
</section>
