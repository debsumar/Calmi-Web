<section [id]="sectionId()" class="px-4 md:px-8 max-w-4xl mx-auto pb-20 md:pb-28">
  <h2 appAnimateOnScroll style="--index:0" class="text-3xl md:text-4xl font-bold text-center text-ink mb-2">
    {{ heading() }}
  </h2>
  <p appAnimateOnScroll style="--index:1" class="text-base text-ink-soft text-center mb-8">
    {{ subtitle() }}
  </p>

  <div class="flex flex-col gap-4">
    @for (faq of faqs(); track faq.question; let i = $index) {
      <div appAnimateOnScroll [style.--index]="i + 2"
           class="bg-surface rounded-2xl overflow-hidden transition-all duration-300 motion-reduce:transition-none"
           [class]="openFaq() === i ? 'shadow-card ring-1 ring-brand/20' : 'shadow-card'">
        <h3>
          <button type="button"
                  (click)="toggleFaq(i)"
                  [attr.aria-expanded]="openFaq() === i"
                  [attr.aria-controls]="idPrefix() + '-panel-' + i"
                  [id]="idPrefix() + '-trigger-' + i"
                  class="w-full flex items-center justify-between gap-4 text-left px-5 md:px-6 py-5 text-lg font-semibold text-ink hover:text-brand-dark dark:hover:text-brand-light transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-inset">
            <span>{{ faq.question }}</span>
            <svg lucideChevronDown [size]="18" aria-hidden="true"
                 class="shrink-0 transition-all duration-300 motion-reduce:transition-none"
                 [class]="openFaq() === i ? 'rotate-180 text-brand' : 'text-ink-muted'"></svg>
          </button>
        </h3>

        <div class="grid transition-[grid-template-rows] duration-300 ease-out motion-reduce:transition-none"
             [class]="openFaq() === i ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'">
          <div [id]="idPrefix() + '-panel-' + i" role="region" [attr.aria-labelledby]="idPrefix() + '-trigger-' + i"
               [attr.inert]="openFaq() === i ? null : ''"
               class="overflow-hidden">
            <div class="mx-5 md:mx-6 border-t border-hairline pt-4 pb-5">
              <p class="max-w-2xl text-base text-ink-soft leading-relaxed">
                {{ faq.answer }}
              </p>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
